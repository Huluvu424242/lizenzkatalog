name: License lint

on:
  pull_request:
  push:
    branches:
      - master
      - automation/license-catalog-sync

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run license lint
        run: |
          python -V
          python tools/license_lint.py
